# Cloudflare configuration for the MarkItDown web playground in website/.
#
# This is a Workers project serving static assets — the shape Cloudflare's
# "import a repository" flow creates, which deploys with `wrangler deploy`.
# Without the [assets] block that command fails with "Missing entry-point to
# Worker script or to assets directory", because Wrangler has nothing to upload.
#
# There is no Worker script: `directory` alone makes this an assets-only
# deployment, which is all a fully client-side site needs. The site's `_headers`
# file is honoured by Workers static assets, so the Content-Security-Policy and
# cache rules in website/src/_headers apply to the deployed site.
#
# Build the directory this points at first:
#
#     python3 website/build.py
#
# `name` must match the Cloudflare project being deployed to. Rename the project
# in the dashboard and this has to change with it.
#
# Deploying to Cloudflare *Pages* instead needs a different key — see
# website/README.md.

name = "markitdown-web"
compatibility_date = "2025-01-01"

[assets]
directory = "./website/dist"
